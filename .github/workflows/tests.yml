name: Pipeline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r cms_incremental_pipeline/requirements.txt -r wordpress_scraping_pipeline/backend/requirements.txt pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q pipeline_runtime.py cms_incremental_pipeline/backend wordpress_scraping_pipeline/backend scripts
