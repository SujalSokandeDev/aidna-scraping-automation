name: AIDNA Nightly Scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Discovery mode (never resets tracking or deletes content)'
        required: true
        default: incremental
        type: choice
        options: [incremental, full]
      target:
        description: 'Pipeline to run'
        required: true
        default: both
        type: choice
        options: [cms, wp, both]
      limit:
        description: 'Maximum changed records per CMS collection / URLs per site'
        required: true
        default: '250'
        type: string
      verify_staging:
        description: 'Exercise expiring staging-table delivery using genuine records'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aidna-scraping-production
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  MODE: ${{ inputs.mode || 'incremental' }}
  RECORD_LIMIT: ${{ inputs.limit || '250' }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  EXPECTED_GCP_PROJECT_ID: ztudiumplatforms
  BIGQUERY_DATASET: strapi_content_data
  BIGQUERY_PARAMETER_LIMIT_BYTES: ${{ inputs.verify_staging && '100' || '3000000' }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
  GOOGLE_CREDENTIALS_PATH: ${{ github.workspace }}/service-account.json

jobs:
  cms-pipeline:
    name: CMS (${{ matrix.source }})
    if: github.event_name == 'schedule' || inputs.target == 'cms' || inputs.target == 'both'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [businessabc, sportsabc]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BIGQUERY_TABLE: unified_cms_content_combined
      BUSINESSABC_STRAPI_GRAPHQL_URL: ${{ secrets.BUSINESSABC_STRAPI_GRAPHQL_URL }}
      BUSINESSABC_STRAPI_BEARER_TOKEN: ${{ secrets.BUSINESSABC_STRAPI_BEARER_TOKEN }}
      SPORTSABC_STRAPI_GRAPHQL_URL: ${{ secrets.SPORTSABC_STRAPI_GRAPHQL_URL }}
      SPORTSABC_STRAPI_BEARER_TOKEN: ${{ secrets.SPORTSABC_STRAPI_BEARER_TOKEN }}
      LOG_FILE: ${{ github.workspace }}/cms_incremental_pipeline/logs/cms-${{ matrix.source }}.log
      PIPELINE_REPORT_PATH: ${{ github.workspace }}/cms_incremental_pipeline/logs/report-${{ matrix.source }}.json
      SOURCE: ${{ matrix.source }}
      PAGE_SIZE: '100'
      INSERT_BATCH_SIZE: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cms_incremental_pipeline/requirements.txt
      - run: pip install -r cms_incremental_pipeline/requirements.txt
      - name: Prepare credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python -c "import os,pathlib; p=pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS']); p.write_text(os.environ['GCP_SERVICE_ACCOUNT_JSON']); p.chmod(0o600)"
      - name: Reconcile CMS records
        working-directory: cms_incremental_pipeline/backend
        run: python pipeline.py --mode "$MODE" --source "$SOURCE" --limit "$RECORD_LIMIT" --no-wikipedia
      - name: Publish result summary
        if: always()
        run: python scripts/summarize_run.py "$PIPELINE_REPORT_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-${{ matrix.source }}-${{ github.run_number }}
          path: cms_incremental_pipeline/logs/
          retention-days: 14
      - name: Remove runner credentials
        if: always()
        run: python -c "import os,pathlib; pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS']).unlink(missing_ok=True)"

  wp-pipeline:
    name: Website (${{ matrix.site }})
    if: github.event_name == 'schedule' || inputs.target == 'wp' || inputs.target == 'both'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        site: [FashionABC, FreedomX, HedgeThink, IntelligentHQ, TradersDNA]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BIGQUERY_TABLE: unified_all_cms_content
      SITE: ${{ matrix.site }}
      LOG_FILE: ${{ github.workspace }}/wordpress_scraping_pipeline/logs/wp-${{ matrix.site }}.log
      PIPELINE_REPORT_PATH: ${{ github.workspace }}/wordpress_scraping_pipeline/logs/report-${{ matrix.site }}.json
      PIPELINE_MAX_SECONDS: '2400'
      WIKIMEDIA_MAX_IMAGES: '0'
      REQUEST_TIMEOUT: '20'
      MAX_RETRIES: '2'
      INSERT_BATCH_SIZE: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: wordpress_scraping_pipeline/backend/requirements.txt
      - run: pip install -r wordpress_scraping_pipeline/backend/requirements.txt
      - name: Prepare credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python -c "import os,pathlib; p=pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS']); p.write_text(os.environ['GCP_SERVICE_ACCOUNT_JSON']); p.chmod(0o600)"
      - name: Reconcile website records
        working-directory: wordpress_scraping_pipeline/backend
        run: python pipeline.py --mode "$MODE" --site "$SITE" --limit "$RECORD_LIMIT"
      - name: Publish result summary
        if: always()
        run: python scripts/summarize_run.py "$PIPELINE_REPORT_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-${{ matrix.site }}-${{ github.run_number }}
          path: wordpress_scraping_pipeline/logs/
          retention-days: 14
      - name: Remove runner credentials
        if: always()
        run: python -c "import os,pathlib; pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS']).unlink(missing_ok=True)"

  notify:
    name: Pipeline result
    needs: [cms-pipeline, wp-pipeline]
    if: always()
    runs-on: ubuntu-latest
    env:
      CMS_RESULT: ${{ needs.cms-pipeline.result }}
      WP_RESULT: ${{ needs.wp-pipeline.result }}
      TARGET: ${{ inputs.target || 'both' }}
    steps:
      - name: Check selected jobs
        run: |
          python - <<'PY'
          import os
          results = {'cms': os.environ['CMS_RESULT'], 'wp': os.environ['WP_RESULT']}
          selected = results if os.environ['TARGET'] == 'both' else {os.environ['TARGET']: results[os.environ['TARGET']]}
          print(selected)
          if any(result != 'success' for result in selected.values()):
              raise SystemExit('At least one selected pipeline failed, was cancelled, or did not execute')
          print('Selected bounded runs completed. Read per-source summaries for deferred backlog; this is not a claim that all historical content is current.')
          PY
